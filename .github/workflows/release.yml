name: Create Release

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_VERSION: '10.0.x'

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore PCInventory/PCInventory.csproj
      
    - name: Build application
      run: dotnet build PCInventory/PCInventory.csproj --configuration Release --no-restore
      
    - name: Publish Windows x64
      run: dotnet publish PCInventory/PCInventory.csproj --configuration Release --runtime win-x64 --self-contained true --output ./release/win-x64 -p:PublishSingleFile=false -p:PublishReadyToRun=false
      
    - name: List published files
      run: |
        Write-Host "Contents of release folder:"
        Get-ChildItem -Path "./release/win-x64" -Recurse | Format-Table Name, Length, LastWriteTime
        Write-Host "Total files: $((Get-ChildItem -Path './release/win-x64' -Recurse -File).Count)"
        Write-Host "Total size: $([math]::Round(((Get-ChildItem -Path './release/win-x64' -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1MB), 2)) MB"
      
    - name: Create zip package
      run: |
        Compress-Archive -Path "./release/win-x64/*" -DestinationPath "./PCInventory-win-x64.zip"
      
    - name: Get version from tag
      id: version
      run: |
        $version = $env:GITHUB_REF -replace 'refs/tags/v', ''
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref }}
        name: PC Inventory v${{ steps.version.outputs.VERSION }}
        body: |
          ## PC Inventory v${{ steps.version.outputs.VERSION }}
          
          ### 🚀 Features
          - System information collection from multiple PCs
          - Hardware and software inventory
          - Network information gathering
          - Custom registry value monitoring
          - CSV export functionality
          
          ### 📦 Downloads
          - **Windows x64**: PCInventory-win-x64.zip (Self-contained - no .NET installation required)
          
          ### 📋 Requirements
          - Windows 10/11 or Windows Server 2016+ (x64)
          - No additional dependencies required
          - Network access to target computers
          
          ### 🔧 Installation
          1. Download the PCInventory-win-x64.zip package
          2. Extract the ZIP file
          3. Run PCInventory.exe as administrator (recommended)
          
          For detailed instructions, see the [README](https://github.com/gavc/pcinventory/blob/main/README.md).
        files: |
          PCInventory-win-x64.zip
        draft: false
        prerelease: false
